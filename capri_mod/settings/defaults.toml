# capri-mod run settings: the defaults (agreed 23 October 2026; capri_mod/settings/__init__.py).
#
# One value per setting. A run changes them with its own TOML file(s) and overrides (capri_mod.settings.load;
# tools/run/run_f2f_2030.py --settings FILE and its flags); the effective settings are saved with each run.
# Every key names what it does and CAPRI's equivalent. DEPARTURE marks a default that differs from CAPRI's,
# with the reason; CAPRI-ERROR-FIX marks a correction of CAPRI's code (described in docs/DEPARTURES_FROM_CAPRI.md).
# Sourced economic parameters are not here: capri_data/shared/model_parameters.csv.

[run]
# CAPRI's manure trade between regions (GUI "New Manure Trade Module", manureTradeNew; star 3.0 GUI default on).
# A scenario may set its own (PolicyScenario.manure_trade); it then holds for the scenario and its baseline.
manure_trade = true
# base year of the data (only capri_data/2017 exists; 2030 runs go through the projection layer)
base_year = "2017"
# worker processes for the regional solves: 0 = the machine's cores (the environment variable CAPRI_WORKERS, if set,
# decides then: it is a property of the machine), 1 = in the main process, n = n workers. Results do not depend on it.
n_workers = 0
# compute the environmental accounts after the solve
run_environmental = true
# report the EU biofuel block (feedstock demand is always in the market)
report_biofuel = false
# IPOPT solver objects kept per region graph (environment variable CAPRI_NLP_CACHE wins if set)
nlp_cache_size = 64

[outer_loop]
# the supply-market iterations at most (CAPRI's %STEPS%: 99 in its GUI for a scenario run, gui/capri_gui_definition.xml
# l. 2891-2897); 60 since 28 October 2026 (the project lead's decision; 25 before): CAPRI's stop rule needs 30 in the
# Green Deal 2030 scenario (r168)
max_outer_iter = 60
# convergence of the outer loop: largest relative price change between iterations (CAPRI p_minIterChg 0.05%, on
# a different metric)
outer_tolerance = 0.005
# supply-side gap (production the supply models deliver vs the market's anticipation), relative
supply_gap_tol = 0.005
# regional nitrogen-balance price still moving between iterations (normalised: 1e-3 = within its own tolerance)
nbal_update_tol = 0.001
# manure pools: each country pool clears within this share of its manure supply
manure_pool_tol = 0.03
# outer-iteration cap with the manure market on (the pool loop contracts ~3.5% per iteration)
manure_max_outer_iter = 60
# runs with at least this many outer iterations are extended to manure_max_outer_iter when manure trade is on
manure_extend_min_iter = 25
# relaxation of the supply price signal between outer iterations (the adaptive step's ceiling)
price_relaxation = 0.5
# adaptive price step per product: halved (not below relax_floor) when the gap changes sign, x relax_step_up else
relax_step_down = 0.5
relax_floor = 0.1
relax_step_up = 1.25
# every price passed to the supply models (EU signal, member-state milk, EU blocks, Norway, young animals): "adaptive"
# (the step above) or "capri" (CAPRI's price forecast, capmod/define_stepWeights.gms and price_forecast.gms l. 376-397:
# the weighted average of the market's prices of the last steps, weights below). CAPRI's, the default since 26 October
# 2026 (the user's decision): with the K75 fix it converges in Farm-to-Fork (9 iterations, r140) and Green Deal 2030
# (13, r142), to the equilibrium of the adaptive step (r139, r141); "adaptive" kept as an option
price_update = "capri"
# what stops the outer loop: "capri" (CAPRI's stop rule, capmod/price_forecast.gms l. 96-371: no more than two items
# still changing by more than 0.05% between iterations, young animals left out; capri_mod/utils/capri_stop.py; with
# the model's inner balances settled: N-balance price, manure pools, young-animal balance, base calibration) or
# "capri-mod" (this model's tests: price and quantity changes, the gap between each price and the market's,
# member-state milk, and the same inner balances). CAPRI's verdict is recorded in either case
# (outer_history[...]["conv"]["capri"], metadata capri_stop). CAPRI's since 28 October 2026 (the project lead's
# decision, K79): Farm-to-Fork stops by it after 12 iterations (r164), the Green Deal 2030 scenario after 30 (r168;
# r165 was stopped by hand at iteration 20, before its time limit)
stop_rule = "capri"
milk_ms_relax_floor = 0.02
capri_step_weights = [0.55, 0.30, 0.15]
capri_step_weights_late = [0.4, 0.3, 0.2, 0.1]
capri_step_weights_late_from = 20
# CAPRI's slower smoothing for "problem products which tend to fluctuate a lot in the market" (define_stepWeights.gms
# l. 41-50, price_forecast.gms l. 384-386; p_stepWgtSpecial(ms, product, "srt"), assigned in a policy file): entries
# [member state, product, srt] as CAPRI's; at step k the price passed to that member state's supply models is the
# average of the baseline price and the market prices of steps 1..k, step j weighted max(0, 1 - srt (k + 1 - j)) (the
# baseline j = 0): for raw milk the member state's own milk price; for another product the member state's models get
# the smoothed price as a departure from the price the rest of its market sees; NO000000 for Norway's prices. CAPRI's
# Green Deal scenarios set none (greendeal_scenarios.gms l. 82: the Maltese milk entry is commented out). Acts with
# price_update = "capri"
capri_step_special = []
# Not CAPRI's (a report; it decides nothing): when the loop ends, the items of CAPRI's stop rule whose last n changes
# all had the same sign, the last still above 0.05% (CAPRI's rule allows stopping with two such rows), with the rate at
# which their changes shrink and a rough estimate of the movement still to come; in metadata capri_stop drift, and a
# warning when the loop stopped. 0: off
drift_report_steps = 3
# member states whose milk delivery is below this share of the EU's do not hold the milk gap open
milk_ms_min_share = 0.01
# supply gap: products below this production (kt) do not count (CAPRI 10 x p_minAbsProdIterChg 0.5)
sup_gap_min_prod = 5.0
# Norway's supply gap stops counting from this iteration (CAPRI: p_iterChg("NO000000",..) = 0 from step 15)
norway_gap_last_iter = 15
# IPOPT's tolerance in the regional models, throughout the outer loop
nlp_tol_final = 1e-8
# manure pools' price update: realised/planned response factor bounds, minimum plan, step bounds, QP settings
manure_pool_kappa_bounds = [0.05, 1.5]
manure_pool_min_plan = 0.002
manure_pool_omega_up = 1.25
manure_pool_omega_down = 0.5
manure_pool_omega_min = 0.25
manure_pool_qp_tol = 1e-8

[supply]
# PMP terms: "capri2030" (CAPRI's exported 2030 terms at 2030; CAPRI's recipe at its 2017 point at 2017) or "recipe"
# (capri-mod's own with CAPRI's recipe); activities without a term are held at their level ("elasticity", the legacy
# calibration from CAPRI's elasticities, removed 28 October 2026, audit S13)
pmp_source = "capri2030"
# with capri2030: which parts take CAPRI's terms
pmp_capri_parts = ["crops", "animals", "feed", "land"]
# PMP cross terms between activities: "capri" (CAPRI's structure, p_useCropSpecificQMatrix 0) or "none" (diagonal only)
pmp_cross_terms = "capri"
# CAPRI's land market (p_landIsFixedinScenario 0, Trustee_land variant): land types as variables
use_land_market = true
# permanent-grassland decline allowed under the Green Deal (CAPRI default 0)
grassland_allowance = 0.0
# CAPRI's greening rules (permGrasGreening_)
cap_greening = true
# DEPARTURE: CAPRI optimises replacement heifers and the four calf activities on their own and clears young animals
# per sex; off because the Farm-to-Fork run does not converge with them (K65); to be switched to CAPRI's setting
use_cattle_member_splits = false
# CAPRI has no variable for an activity without a level (p_technFact): held at zero by its bounds (CAPRI's setting
# since 23 October 2026). The NLP failures that had kept it off were two inconsistencies, both fixed: the crop
# diversification index took the fixed columns' logs, and the permanent-grassland rule applied to a grassland of
# 3.5e-11 kha (KNOWN_ISSUES K69)
absent_activities_fixed = true
# JRC121368 capped regions given instead of the nine highest baseline surpluses (comma list; "" = the rule)
jrc_capped_override = ""
# IPOPT: iteration limits (cold, warm start), acceptable tolerance, CPU guard (s), calibration tolerance (the
# solve tolerance is outer_loop.nlp_tol_final / nlp_tol_early)
nlp_max_iter = 3000
nlp_warm_max_iter = 200
# numerical safeguard (not a CAPRI parameter): a warm-started solution whose objective is more than this share worse
# than the last iteration's is checked against the solves from the previous point and the standard start, keeping the
# lowest objective; the warm start can end at a worse stationary point of the non-convex per-head feeding (K75)
nlp_warm_check = 0.01
# numerical safeguard (not a CAPRI parameter; K79): where a regional solution's activity levels move by more than this
# share between outer iterations (|dy| over the larger of the level and 1% of the region's largest column), the region
# is also solved from its previous point (cold) and from the standard start and the lowest objective is kept. A warm
# start in a non-convex regional problem can end at a worse local optimum (HU330000, Green Deal 2030: 2,200 worse, the
# region switching between two states every few iterations; r174). 0 = off
nlp_jump_check = 0.1
# the relative objective gain another start's solution needs to replace the warm one in the jump check (K79; the
# project lead's decision of 29 October 2026). Without it any lower objective switched: in the Green Deal 2030 run r181
# 938 of 961 switches gained 1e-9 or less (the same optimum to the solver's precision), the other 23 gained 1.7e-5 and
# more; 1e-6 lies in that gap
nlp_jump_gain = 1e-6
nlp_acceptable_tol = 1e-6
# IPOPT's treatment of fixed columns (lower = upper bound): "make_constraint" keeps them as variables held by an
# equality (trial points may leave the bound), "make_parameter" removes them from the problem (CAPRI: an activity
# without a level has no variable)
nlp_fixed_variable_treatment = "make_constraint"
nlp_max_cpu_time = 60.0
nlp_cal_tol = 1e-6
# inner loop of the supply module: N-balance price
nbal_tol_abs = 0.01
nbal_tol_rel = 1e-3
nbal_inner_max = 16
# manure trade cost slope: CAPRI define_manure_trade_costs.gms l. 66-71, EUR 50 per t N for each 1% of the region's
# manure N traded (0.05 in the model's EUR 1000)
manure_pool_slope = 0.05
# Green Deal organic and pesticide targets: CAPRI's regional input changes (define_inputs.gms l. 66-73).
# CAPRI-ERROR-FIX. conventional_io.gms l. 361 sets scenAugmentsTechChange off at compile time, after organic_io.gms
# l. 94 and conventional_io.gms l. 171 set it on, so the scenario's input change REPLACES the 2017-2030 input-saving
# progress TF_I instead of multiplying it (CAPRI's own notes call the off setting an oversight).
# true: (1 + change) x TF_I; false: CAPRI's code as written (parity switch)
greendeal_inputs_keep_tech_change = true
# CAPRI-ERROR-FIX. organic_io.gms l. 107-115 tops up the organic crops' other inputs by EFUL x 2 x the crop's target
# ("costs for EFUL+SERI would double") but adds the fuel coefficient to the INPO coefficient, valuing it at INPO's
# unit value. true: valued at the fuel cost; false: CAPRI's code as written (parity switch)
organic_topup_at_fuel_cost = true
# CAPRI's fertiliser-option curvature with the fertiliser saving valued at the member state's NITF price (envind/
# ghgMiti.gms l. 1016-1035, audit S5); false: without (this model before 24 October 2026). OFF by default (25 October
# 2026): with it and the cost on the N purchases, the curvature turns negative where NMIN is large and the baseline
# leaves the base share (FR10 precision farming 0.44 at the 2030 baseline, run r128: EU 9.6%); either part alone
# keeps the base. Open (KNOWN_ISSUES K77)
fert_slope_with_saving = false

[fertiliser]
# the inner model's duals widened to +-1000 where CAPRI's +-10 admit no allocation (REGISTERED, CAPRI's own
# workaround is a slack)
npk_dual_bound_wide = 1000.0
# a crop group whose mineral cap leaves its N need out of reach (NLP infeasible) is exempted as CAPRI exempts groups
# (minfert_redu_by_crop.gms, p_checkSmallMine): its cap at this multiple of its baseline mineral N per ha (CAPRI: 1.0
# for its small groups, "no backsliding"; 1.1-1.2 for its listed region x group pairs)
exempt_cap_factor = 1.0
# inner distribution solve: tolerance, iterations
fd_tol = 1e-9
fd_max_iter = 100

[market]
# the market supply Hessian measured again at the scenario's state, at this outer iteration of a scenario (0: never,
# CAPRI's: once per baseline). Tried for K75 (run r132, iteration 8): +62 min per scenario, the calf price crept as
# before; back to CAPRI's 0 (the user's go-ahead, 25 October 2026)
hessian_scenario_iter = 0
# How the market supply Hessian is measured (model._market_supply_hessian; CAPRI re-solves every regional model per
# shocked price, calibrate_supply.gms). true: the base is re-solved first from the baseline's state and the shocks'
# differences taken to it; a region whose first solve under a shock has the base's inputs (problem, start, options:
# the shocked price does not reach it) is not re-solved, as its solve would repeat the base's exactly. The same
# Hessian as re-solving every region from that state, with fewer solves. false: every region re-solved, differences
# to the baseline's own solution (until 27 October 2026; cached Hessians keep their keys)
hessian_skip_unchanged = true
# BEYOND CAPRI (the project lead's decision, 29 October 2026): "capri" measures the market supply Hessian as CAPRI does,
# re-solving the supply models at each 1% price shock (calibrate_supply.gms); "kkt" takes each shock's solution as the
# first-order step of the KKT conditions from the base solution (the implicit function theorem with the base's active
# set: the exact derivative where CAPRI's is a 1% difference quotient; no change of the active set within the shock).
# Needs hessian_skip_unchanged (its base re-solve records the base points)
hessian_method = "capri"
# CAPRI's endogenous biofuel markets (BIOF_M; star 3.0 GUI default on); a scenario may set its own
biofuel_markets = true
# DEPARTURE: CAPRI's default aggregation has two EU trade blocks (EU_WEST, EU_EAST; aggregation/defaultA.agg);
# one EU27 block by default so far; to be switched to CAPRI's setting
eu_blocks = false
# CAPRI's market supply functions calibrated to the supply models (calibrate_supply.gms, ProdNQ_, recalibrated each
# iteration by simu_calibration_to_supply.gms); CAPRI's setting since 24 October 2026 (K75). The Hessian is measured
# once per baseline by price shocks on the supply models and cached on disk (.cache/market_supply_hessian)
market_supply_nq = true
# the non-EU market regions' supply as CAPRI's market supply functions (arm/market_model.gms ProdNQ_: p_hessNQSupp at
# the 2030 calibration point with its cross-price terms and raw milk's, tools/build/build_noneu_market_supply_nq.py;
# KNOWN_ISSUES K54-3); false: one own-price constant elasticity per region and product (CAPRI's p_elasSupp of 2017),
# the form until 29 October 2026
noneu_supply_nq = true
# CAPRI's feed bulk demand inside the market (feedBlk_, audit M4): the member states' bulks respond to the prices within a
# market solve from the supply models' bulks at the prices they saw, with the elasticities measured on the supply models
# (the market supply Hessian's FEEDBLK rows); false: fixed within a solve (until 29 October 2026). Same fixed point
feed_bulk_in_market = true
# CAPRI's non-EU feed demand (FeedNQ_ with the feed energy balance FeedBal_, audit M3): each non-EU behavioural region
# without supply models feeds by its normalised-quadratic feed function of the Arm1 prices and its feed energy price FEDE,
# which clears its feed energy against its animal output; FEDE also moves its market supply functions
# (tools/build/build_feed_energy.py, build_noneu_feed_nq.py); false: p_ElasFeed constant elasticities, FEDE held (until
# 29 October 2026)
noneu_feed_nq = true
# CAPRI's raw milk of the non-EU regions with supply models (Norway, RMSSUP): ProdNQ_ MILK stays in the market
# (arm/simu_calibration_to_supply.gms l. 423-427: v_prodQuant MILK at the supply models' level, bounds 0.1 to 10 x, the
# constant re-anchored there), so the milk delivered responds to the region's dairy-block milk price and to the other
# prices with the market supply Hessian's MILK row, and the products to the milk price with its MILK column (step F,
# 29 October 2026); false: Norway's milk fixed at its supply models' within a market solve (until 29 October 2026)
sup_milk_in_market = true
# price shock of the market supply Hessian (calibrate_supply.gms)
nq_price_shock = 0.01
# bilateral market solve: acceleration ("anderson" or "none"), memory, chord step for trade, Newton rounds,
# tolerance, damping, step clip
acceleration = "anderson"
aa_memory = 5
trade_chord = true
# the trade systems' Newton with the exact Jacobian from CasADi (market programme step G1, capri_mod/market/trade_ad.py)
# instead of finite differences; same equations and root
exact_jacobian = false
max_iter = 100
tol = 1e-7
damping_increase_threshold = 0.999
damping_min = 0.25
damping_down = 0.5
damping_recover_threshold = 0.95
damping_up = 1.5
step_clip = [0.2, 5.0]

[young_animals]
# cleared inside the market model with the products (CAPRI arm/market_model.gms yaniMarket_, the market's supply
# functions with young-animal rows and columns); false: a price update between market solves, which leaves a slow
# beef / calf price mode (K75). Needs market.market_supply_nq; the EU trade blocks keep the update between solves
tol = 0.005
relaxation = 0.7
# price update: the supply models' exact response ("auto": with the member splits only; "on", "off")
use_exact = "auto"
# price ratios bounded as CAPRI's (+-10 x level, set_start_val.gms, widen_bounds.gms: here +-50 x base)
ratio_bounds = [-50.0, 50.0]
# Newton step limited to this share of the current or base price
max_step = 0.3
# imbalance scale: at least this share of the EU's production of the good
small_market_scale = 0.1

[environment]
# CAPRI-ERROR-FIX: CAPRI's ad_data_and_cali.gms l. 588 zeroes the factor dairy AD needs; "fix" applies CAPRI's CH4 factor
# to dairy cows as to the other animals, "capri" reproduces CAPRI as coded
ad_dairy_ch4 = "fix"
# CAPRI-ERROR-FIX: sign of the ammonia losses at application in the N leaching cascade: "consistent" (as RUNSURFN_),
# "capri" (CAPRI's code)
ammapp_sign = "consistent"
# LUC solve: IPOPT tolerance and iterations
luc_ipopt_tol = 1e-12
luc_max_iter = 500

[projection]
# CAPRI's baseline calibration in projected years: rounds, tolerance, stall ratio (fodder crops held by their balances)
base_cal_rounds = 4
base_cal_tol = 0.002
base_cal_stall_ratio = 0.95
# the simulation year of CAPRI's 2030 reference (year-dependent exemptions of the fertiliser caps)
sim_year = 2030
# growth factors outside these bands are rejected (CAPTRD import; trajectories)
captrd_factor_bounds = [0.2, 5.0]
trajectory_factor_bounds = [0.1, 10.0]

[endotech]
# CAPRI's endogenous-technology settings, star 3.0's Green Deal reference (pol_input/greendeal/
# refpol_endotech_all_sup.gms); scenario configuration: they hold for a scenario and its baseline
ghgTechMYld = 0.0
ghgTechFEff = 0.1
ghgTechLowNFeed = 1.0
ghgTechLineNitr = 1.0
# %fixGenet_eff_to_iniValues% (breeding.gms l. 65-77): MaxShare 0.002 of the breeding options
fixGenetToIni = 1.0

[diagnostics]
verbose = true
# outer-loop trace
trace_outer = false
# every region's activity levels per outer iteration in the outer history (K79 diagnosis; large)
record_regional_levels = false
# regions slower than this (s) are reported
slow_region_seconds = 60.0

[captrd]
# CAPTRD-MOD (capri_mod/pipeline/captrd): CAPRI's baseline trend projection (docs/design/CAPTRD_MOD.md).
# %FirstYear%: first year of CAPTRD's YEARS set; the trend variable is p_trend(t) = ORD(t)/10, so 1984 -> 0.1
# (captrd.gms l. 203, 271; GUI default 1984, gui/capri_gui_definition.xml l. 3906)
first_year = 1984
# Step 1 grid search on the exponent c of x = a + b*t^c (estimate_trends.gms l. 28, 50-51, 80-82)
c_min = 0.02
c_max = 1.2
c_grid_points = 30
# Series with 1-4 observations. CAPRI-ERROR-FIX. CAPRI fixes c = 1 (3-4 observations) or b = 0 (1-2 observations)
# and states that only the first grid point is relevant (estimate_trends.gms l. 158), but the minimum over the grid
# (l. 166) also sees the other 29 points, zeroed at l. 160, so a series whose first-point fit is not exact gets
# a = b = c = 0 and Step1 = 0. Confirmed in CAPRI's own CAPTRD output (results_1770.gdx, 23 October 2026): of the
# 93 series with 2-4 observations, 92 have Step1 = 0 (the 2 observations: support 0.001 x base, since wR2 = 1;
# 3-4: wR2 = 0, support = base).
# false (default): the minimum over the first grid point only, CAPRI's stated intent;
# true: CAPRI's code as written (the parity switch, CAPTRD_MOD.md section 8.3)
short_series_grid_as_coded = false
# Floor of the stored error variance (define_stats_and_supports.gms l. 327-329). CAPRI-ERROR-FIX. CAPRI's code takes
# max(0.05 x |wAve|, wVarErr): a level against a variance (wVarErr is a sum of squared residuals, l. 118-123, its
# 1-2 observation fall-back SQR(wAve) x 0.25, l. 130; sqrt(wVarErr) is used as a standard deviation,
# define_eu_supports.gms l. 693). The floor binds in 19.5% of CAPRI's series (results_1770.gdx).
# true (default): (0.05 x |wAve|)^2, a 5% coefficient of variation; false: CAPRI's code as written (parity switch).
# No effect on results until Steps 2-3 are ported (the variance weights their penalty terms)
variance_floor_squared = true
# BASYRS5 = {ex-post years t with |t - BAS| <= h} (captrd.gms l. 703): the base-period window of the BAS average
# (prep_data_for_estimation.gms l. 252-261) and of the market-balance exclusions (l. 31-32). CAPRI's h = 3 spans
# seven calendar years under the name "5", but the set is restricted to ExPost, which ends at BAS + 1 in the
# reference run (CAPREG series to 2018, BAS 2017): 2014-2018, five years. Not an error in that configuration
basyrs5_halfwidth = 3

[pipeline]
# The data download layer (capri_mod/pipeline; docs/DATA_PIPELINE.md). Where the store (raw downloads, manifest, Delta
# tables) lives: empty = capri_data/pipeline/store; the environment variable CAPRI_PIPELINE_STORE overrides both
store_dir = ""
# HTTP: timeout (s) per request, retries on network errors and 5xx/429 answers, first wait (s, doubled each retry)
http_timeout = 120.0
http_retries = 3
http_retry_wait = 5.0
# Eurostat's asynchronous extractions (large requests): seconds between status checks and the longest wait
eurostat_async_poll = 10.0
eurostat_async_max_wait = 1800.0
# provider endpoints
eurostat_api = "https://ec.europa.eu/eurostat/api/dissemination"

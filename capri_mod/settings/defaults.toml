# capri-mod run settings: the defaults (agreed 23 October 2026; capri_mod/settings/__init__.py).
#
# One value per setting. A run changes them with its own TOML file(s) and overrides (capri_mod.settings.load;
# tools/run/run_f2f_2030.py --settings FILE and its flags); the effective settings are saved with each run.
# Every key names what it does and CAPRI's equivalent. DEPARTURE marks a default that differs from CAPRI's,
# with the reason; CAPRI-ERROR-FIX marks a correction of CAPRI's code (described in docs/DEPARTURES_FROM_CAPRI.md).
# Sourced economic parameters are not here: capri_data/shared/model_parameters.csv.

[run]
# CAPRI's manure trade between regions (GUI "New Manure Trade Module", manureTradeNew; star 3.0 GUI default on).
# A scenario may set its own (PolicyScenario.manure_trade); it then holds for the scenario and its baseline.
manure_trade = true
# base year of the data (only capri_data/2017 exists; 2030 runs go through the projection layer)
base_year = "2017"
# worker processes for the regional solves: 0 = the machine's cores (the environment variable CAPRI_WORKERS, if set,
# decides then: it is a property of the machine), 1 = in the main process, n = n workers. Results do not depend on it.
n_workers = 0
# compute the environmental accounts after the solve
run_environmental = true
# report the EU biofuel block (feedstock demand is always in the market)
report_biofuel = false
# IPOPT solver objects kept per region graph (environment variable CAPRI_NLP_CACHE wins if set)
nlp_cache_size = 64

[outer_loop]
# CAPRI's supply-market iterations (%STEPS%); runs with manure trade use manure_max_outer_iter
max_outer_iter = 25
# convergence of the outer loop: largest relative price change between iterations (CAPRI p_minIterChg 0.05%, on
# a different metric)
outer_tolerance = 0.005
# supply-side gap (production the supply models deliver vs the market's anticipation), relative
supply_gap_tol = 0.005
# regional nitrogen-balance price still moving between iterations (normalised: 1e-3 = within its own tolerance)
nbal_update_tol = 0.001
# manure pools: each country pool clears within this share of its manure supply
manure_pool_tol = 0.03
# outer-iteration cap with the manure market on (the pool loop contracts ~3.5% per iteration)
manure_max_outer_iter = 60
# runs with at least this many outer iterations are extended to manure_max_outer_iter when manure trade is on
manure_extend_min_iter = 25
# relaxation of the supply price signal between outer iterations (the adaptive step's ceiling)
price_relaxation = 0.5
# adaptive price step per product: halved (not below relax_floor) when the gap changes sign, x relax_step_up else
relax_step_down = 0.5
relax_floor = 0.1
relax_step_up = 1.25
# milk price by member state: "adaptive" (the step above, floor milk_ms_relax_floor) or "capri" (CAPRI's price
# forecast: weighted average of the last simulated prices, capmod/define_stepWeights.gms, price_forecast.gms)
milk_ms_step = "adaptive"
milk_ms_relax_floor = 0.02
capri_step_weights = [0.55, 0.30, 0.15]
capri_step_weights_late = [0.4, 0.3, 0.2, 0.1]
capri_step_weights_late_from = 20
# member states whose milk delivery is below this share of the EU's do not hold the milk gap open
milk_ms_min_share = 0.01
# supply gap: products below this production (kt) do not count (CAPRI 10 x p_minAbsProdIterChg 0.5)
sup_gap_min_prod = 5.0
# Norway's supply gap stops counting from this iteration (CAPRI: p_iterChg("NO000000",..) = 0 from step 15)
norway_gap_last_iter = 15
# IPOPT tolerance by stage of the outer loop (off: nlp_tol_final throughout)
nlp_staged_tol = false
nlp_tol_early = 1e-6
nlp_tol_final = 1e-8
nlp_tol_switch = 4.0
# manure pools' price update: realised/planned response factor bounds, minimum plan, step bounds, QP settings
manure_pool_kappa_bounds = [0.05, 1.5]
manure_pool_min_plan = 0.002
manure_pool_omega_up = 1.25
manure_pool_omega_down = 0.5
manure_pool_omega_min = 0.25
manure_pool_qp_tol = 1e-8
manure_pool_qp_max_iter = 300

[supply]
# the regional supply models' form: "nlp" = CAPRI's own equations solved by IPOPT, "conic" = the convex
# reformulation solved by Clarabel (cross-check)
supply_form = "nlp"
# solver of the remaining QPs (ration calibration, the conic form's pre-solve): "clarabel" or "builtin"
qp_solver = "clarabel"
# PMP terms: "capri2030" (CAPRI's exported 2030 terms at 2030; CAPRI's recipe at its 2017 point at 2017), "recipe"
# (capri-mod's own with CAPRI's recipe), "elasticity" (legacy: CAPRI's elasticities only; activities without one are
# held at their level)
pmp_source = "capri2030"
# with capri2030: which parts take CAPRI's terms
pmp_capri_parts = ["crops", "animals", "feed", "land"]
# PMP cross terms between activities: "capri" (CAPRI's structure, p_useCropSpecificQMatrix 0), "previous", "none"
pmp_cross_terms = "capri"
# CAPRI's dampening of supply elasticities (impose_upper_bound_on_elasticity.gms)
pmp_apply_dampening = true
# CAPRI's regional supply elasticities as calibration targets (with them, the PMP share term)
use_capri_elasticities = true
# trust-constr iterations (scipy fallback of the regional QP): the problem is a convex QP, so more iterations reach
# the same optimum; 1000 truncated some regions with many active constraints, 3000 clears them at ~8% extra time
trust_constr_maxiter = 3000
# CAPRI's land market (p_landIsFixedinScenario 0, Trustee_land variant): land types as variables
use_land_market = true
# CAPRI's land balances without slack (LandBalNoSlak_)
land_no_slack = true
# land rows as equalities (CAPRI) rather than inequalities
land_row_equality = true
# N-surplus target per hectare of current farmland (CAPRI e_SURTOTHa)
surplus_per_current_ha = true
# permanent-grassland decline allowed under the Green Deal (CAPRI default 0)
grassland_allowance = 0.0
# CAPRI's ammonia technologies inside the supply models
use_manure_techs = true
# without a policy incentive on N, the ammonia options stay at their calibrated shares (K63)
amm_fix_without_policy = true
# feeding inside the regional supply models (CAPRI)
use_feed_in_supply = true
# CAPRI's rations per region and animal
use_ration = true
# damping of the EU ration path (feeding outside the supply models only)
ration_damping = 0.5
# nitrate as a ration ingredient (line_nitr.gms); off until validated
use_nitrate_in_ration = false
# DEPARTURE: CAPRI values home-grown fodder in the rations at its fodder-balance dual; off because the first
# Farm-to-Fork run with it did not converge (ration <-> fodder dual feedback); to be switched to CAPRI's setting
fodder_at_shadow_price = false
fodder_ratio_bounds = [0.2, 5.0]
fodder_ratio_damping = 0.5
# fodder balance band rows
fodder_band = true
# livestock cost coefficients from CAPRI's results
use_livestock_cost_coef = true
# CAPRI's greening rules (permGrasGreening_)
cap_greening = true
# CAPRI's winter cover endogenous (envind/cover_crops.gms)
winter_cover_endogenous = true
# nitrification inhibitors inside the model
ni_inside_model = true
# CAPRI's intensity choices: grassland, dairy, cattle
use_grass_intensity = true
use_dairy_intensity = true
use_cattle_intensity = true
# DEPARTURE: CAPRI optimises replacement heifers and the four calf activities on their own and clears young animals
# per sex; off because the Farm-to-Fork run does not converge with them (K65); to be switched to CAPRI's setting
use_cattle_member_splits = false
# CAPRI's breeding, low-N feed and supplement options; their slope net of CAPRI's cost-saving drop (K67 F2)
use_genetics = true
use_option_costsaving_drop = true
# CAPRI's histosol fallowing (no_histosols.gms)
use_histosol_fallow = true
# CAPRI's bounds on activity levels (set_supply_bounds.gms: 0.1 to 10 x the data level)
use_capri_activity_bounds = true
# CAPRI has no variable for an activity without a level (p_technFact): held at zero by its bounds (CAPRI's setting
# since 23 October 2026). The NLP failures that had kept it off were two inconsistencies, both fixed: the crop
# diversification index took the fixed columns' logs, and the permanent-grassland rule applied to a grassland of
# 3.5e-11 kha (KNOWN_ISSUES K69)
absent_activities_fixed = true
# solver residue on activities without a base level reported as zero (K64)
absent_output_cleared = true
# the N-target relaxation once needed stays for the scenario; the NLP form's relaxation of the N target
n_relax_sticky = true
nlp_n_relax = true
# JRC121368 capped regions given instead of the nine highest baseline surpluses (comma list; "" = the rule)
jrc_capped_override = ""
# land-use change accounts model (LUC)
luc_model = true
# NLP form: CAPRI's calibration at the base point; the fertilisation block inside
nlp_calibrate = true
# IPOPT: iteration limits (cold, warm start), acceptable tolerance, CPU guard (s), calibration tolerance (the
# solve tolerance is outer_loop.nlp_tol_final / nlp_tol_early)
nlp_max_iter = 3000
nlp_warm_max_iter = 200
nlp_acceptable_tol = 1e-6
# IPOPT's treatment of fixed columns (lower = upper bound): "make_constraint" keeps them as variables held by an
# equality (trial points may leave the bound), "make_parameter" removes them from the problem (CAPRI: an activity
# without a level has no variable)
nlp_fixed_variable_treatment = "make_constraint"
nlp_max_cpu_time = 60.0
nlp_cal_tol = 1e-6
# conic form (Clarabel): tolerance, iterations, equilibration iterations
conic_tol = 1e-8
conic_max_iter = 400
conic_equilibrate_max_iter = 50
# inner loop of the supply module: N-balance price
nbal_tol_abs = 0.01
nbal_tol_rel = 1e-3
nbal_inner_max = 16
# manure trade cost slope: CAPRI define_manure_trade_costs.gms l. 66-71, EUR 50 per t N for each 1% of the region's
# manure N traded (0.05 in the model's EUR 1000)
manure_pool_slope = 0.05

[fertiliser]
# CAPRI's inner fertiliser distribution model (useInnerFertDistModel)
fert_dist_inside = true
# NUTMIN_ minimum mineral share: "capri" (CAPRI's rule), "on", "off"
use_min_mineral_share = "capri"
# the NLP form's fertilisation block (CAPRI's)
nlp_fertilisation = true
# NUTNED_ crop-need rows always present
use_nutned_always = true
# the inner model's duals widened to +-1000 where CAPRI's +-10 admit no allocation (REGISTERED, CAPRI's own
# workaround is a slack)
npk_dual_bound_wide = 1000.0
# mineral caps relaxed to this multiple of the base allocation when the NLP fails (CAPRI: 1.1 x baseline,
# minfert_redu_by_crop.gms)
caps_relax_factor = 1.1
# inner distribution solve: tolerance, iterations; NLP iterations
fd_tol = 1e-9
fd_max_iter = 100
fd_nlp_max_iter = 1000

[market]
# CAPRI's endogenous biofuel markets (BIOF_M; star 3.0 GUI default on); a scenario may set its own
biofuel_markets = true
# DEPARTURE: CAPRI's default aggregation has two EU trade blocks (EU_WEST, EU_EAST; aggregation/defaultA.agg);
# one EU27 block by default so far; to be switched to CAPRI's setting
eu_blocks = false
# DEPARTURE: CAPRI calibrates the market's supply functions to the supply models (calibrate_supply.gms); off so
# far (no gain in speed, not available with the trade blocks yet); to be switched to CAPRI's setting
market_supply_nq = false
# price shock of the market supply Hessian (calibrate_supply.gms)
nq_price_shock = 0.01
# CAPRI's dairy processing block
use_dairy_block = true
# CAPRI's Generalised Leontief food demand; its commitments re-fitted to the base (trim_gl_commits.gms)
food_demand_gl = true
gl_refit_commitments = true
# CAPRI's processing functions (ProcNQ_)
processing_nq = true
# regional supply elasticities in the market's supply anticipation
use_region_supply_elas = true
# crushing margins at producer prices
crush_margin_producer_prices = true
# tariff-rate quotas
use_trq = true
# bilateral market solve: acceleration ("anderson" or "none"), memory, chord step for trade, Newton rounds,
# tolerance, damping, step clip
acceleration = "anderson"
aa_memory = 5
trade_chord = true
max_iter = 100
tol = 1e-7
damping_increase_threshold = 0.999
damping_min = 0.25
damping_down = 0.5
damping_recover_threshold = 0.95
damping_up = 1.5
step_clip = [0.2, 5.0]

[young_animals]
# CAPRI's young-animal markets (yaniMarket_)
enabled = true
tol = 0.005
relaxation = 0.7
# price-update variants: own-response secant (off), the supply models' exact response ("auto": with the member
# splits only; "on", "off")
use_secant = false
use_exact = "auto"
secant_phi_bounds = [0.1, 1.0]
# price ratios bounded as CAPRI's (+-10 x level, set_start_val.gms, widen_bounds.gms: here +-50 x base)
ratio_bounds = [-50.0, 50.0]
# Newton step limited to this share of the current or base price
max_step = 0.3
# imbalance scale: at least this share of the EU's production of the good
small_market_scale = 0.1

[environment]
# CAPRI-ERROR-FIX: CAPRI's ad_data_and_cali.gms l. 588 zeroes the factor dairy AD needs; "fix" applies CAPRI's CH4 factor
# to dairy cows as to the other animals, "capri" reproduces CAPRI as coded
ad_dairy_ch4 = "fix"
# CAPRI-ERROR-FIX: sign of the ammonia losses at application in the N leaching cascade: "consistent" (as RUNSURFN_),
# "capri" (CAPRI's code)
ammapp_sign = "consistent"
# LUC solve: IPOPT tolerance and iterations
luc_ipopt_tol = 1e-12
luc_max_iter = 500

[projection]
# CAPRI's baseline calibration in projected years: rounds, tolerance, fodder included, stall ratio
calibrate_baseline = true
base_cal_rounds = 4
base_cal_tol = 0.002
base_cal_fodder = false
base_cal_stall_ratio = 0.95
# the simulation year of CAPRI's 2030 reference (year-dependent exemptions of the fertiliser caps)
sim_year = 2030
# growth factors outside these bands are rejected (CAPTRD import; trajectories)
captrd_factor_bounds = [0.2, 5.0]
trajectory_factor_bounds = [0.1, 10.0]

[endotech]
# CAPRI's endogenous-technology settings, star 3.0's Green Deal reference (pol_input/greendeal/
# refpol_endotech_all_sup.gms); scenario configuration: they hold for a scenario and its baseline
ghgTechMYld = 0.0
ghgTechFEff = 0.1
ghgTechLowNFeed = 1.0
ghgTechLineNitr = 1.0
# %fixGenet_eff_to_iniValues% (breeding.gms l. 65-77): MaxShare 0.002 of the breeding options
fixGenetToIni = 1.0

[diagnostics]
verbose = true
# outer-loop trace
trace_outer = false
# regions slower than this (s) are reported
slow_region_seconds = 60.0

[captrd]
# CAPTRD-MOD (capri_mod/pipeline/captrd): CAPRI's baseline trend projection (docs/design/CAPTRD_MOD.md).
# %FirstYear%: first year of CAPTRD's YEARS set; the trend variable is p_trend(t) = ORD(t)/10, so 1984 -> 0.1
# (captrd.gms l. 203, 271; GUI default 1984, gui/capri_gui_definition.xml l. 3906)
first_year = 1984
# Step 1 grid search on the exponent c of x = a + b*t^c (estimate_trends.gms l. 28, 50-51, 80-82)
c_min = 0.02
c_max = 1.2
c_grid_points = 30
# Series with 1-4 observations. CAPRI-ERROR-FIX. CAPRI fixes c = 1 (3-4 observations) or b = 0 (1-2 observations)
# and states that only the first grid point is relevant (estimate_trends.gms l. 158), but the minimum over the grid
# (l. 166) also sees the other 29 points, zeroed at l. 160, so a series whose first-point fit is not exact gets
# a = b = c = 0 and Step1 = 0. Confirmed in CAPRI's own CAPTRD output (results_1770.gdx, 23 October 2026): of the
# 93 series with 2-4 observations, 92 have Step1 = 0 (the 2 observations: support 0.001 x base, since wR2 = 1;
# 3-4: wR2 = 0, support = base).
# false (default): the minimum over the first grid point only, CAPRI's stated intent;
# true: CAPRI's code as written (the parity switch, CAPTRD_MOD.md section 8.3)
short_series_grid_as_coded = false
# BASYRS5 = {ex-post years t with |t - BAS| <= h} (captrd.gms l. 703): the base-period window of the BAS average
# (prep_data_for_estimation.gms l. 252-261) and of the market-balance exclusions (l. 31-32). CAPRI's h = 3 spans
# seven calendar years under the name "5", but the set is restricted to ExPost, which ends at BAS + 1 in the
# reference run (CAPREG series to 2018, BAS 2017): 2014-2018, five years. Not an error in that configuration
basyrs5_halfwidth = 3

[pipeline]
# The data download layer (capri_mod/pipeline; docs/DATA_PIPELINE.md). Where the store (raw downloads, manifest, Delta
# tables) lives: empty = capri_data/pipeline/store; the environment variable CAPRI_PIPELINE_STORE overrides both
store_dir = ""
# HTTP: timeout (s) per request, retries on network errors and 5xx/429 answers, first wait (s, doubled each retry)
http_timeout = 120.0
http_retries = 3
http_retry_wait = 5.0
# Eurostat's asynchronous extractions (large requests): seconds between status checks and the longest wait
eurostat_async_poll = 10.0
eurostat_async_max_wait = 1800.0
# provider endpoints
eurostat_api = "https://ec.europa.eu/eurostat/api/dissemination"

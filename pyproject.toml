[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capri-mod"
version = "0.1.0"
description = "A Python re-implementation of the CAPRI agricultural economic model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["capri_mod*"]

[tool.setuptools.package-data]
capri_mod = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["capri_mod/tests"]

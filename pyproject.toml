[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capri-mod"
version = "0.1.0"
description = "A Python reimplementation of the CAPRI star 3.0 agricultural economic model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "casadi>=3.6",       # bundles IPOPT: the regional supply models in CAPRI's NLP form
    "clarabel>=0.7",     # the manure-market pool equilibrium
    "pyarrow>=14",       # Parquet for the model's caches (the market supply Hessians)
]

[project.optional-dependencies]
# requirements.txt lists all of these together; the extras are for installing as a package (pip install ".[dev]")
# the test tools: pytest, pytest-xdist for parallel test processes (python -m pytest -n 2), coverage
dev = ["pytest>=7.0", "pytest-xdist>=3.5", "coverage>=7.0"]
# the data pipeline (capri_mod/pipeline): provider downloads (requests) and the versioned Delta store (deltalake)
pipeline = ["requests>=2.28", "deltalake>=0.18"]
# the reference-building tools (tools/build/*): GDX bindings of the GAMS Python API; the GDX library is built separately
tools = ["gamsapi>=54"]

[tool.setuptools.packages.find]
include = ["capri_mod*"]

[tool.setuptools.package-data]
capri_mod = ["*.json", "*.md", "settings/*.toml"]

[tool.pytest.ini_options]
markers = ["slow: full-EU or multi-solve tests over 30 s (deselect per step with -m 'not slow'; the batch-end run takes all)",
           "online: live provider API tests of the data pipeline (run on request: -m online)"]
testpaths = ["capri_mod/tests", "capri_mod/pipeline/tests"]
# tests that check a mechanism (adoption, accounts, reporting) run the market loop for 1-2 iterations on purpose; the
# model warns loudly about any unconverged run, so this one expected warning is filtered here and every other warning
# (solver fallbacks, skipped technologies, library deprecations) still shows
filterwarnings = ["ignore:Outer supply-market loop did NOT converge:RuntimeWarning"]

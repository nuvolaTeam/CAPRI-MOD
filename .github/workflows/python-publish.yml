# Build the package, check it and try it as an installed package; publish it only if that works.
#
# - by hand (Actions tab, workflow_dispatch): build, check, smoke test, and with "publish: testpypi" upload to TestPyPI;
# - on a published GitHub release: the same, then upload to PyPI.
#
# HOLD (the project lead, 13 November 2026): capri-mod is not yet released on PyPI. The model reads capri_data/ (128 MB)
# from the repository folder, which the wheel does not hold, so an installed package fails at import; the smoke test
# below fails for that reason and no upload happens until the data question is settled (in the wheel, fetched on first
# use, or a path the user sets). The release route meanwhile: the Docker image and the Hugging Face datasets.
#
# Uploads use PyPI's trusted publishing: a "pending publisher" for this repository, this workflow file and the
# environment (testpypi / pypi) has to be added on test.pypi.org / pypi.org first.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "after the checks, upload to: none or testpypi"
        type: choice
        options: [ "none", "testpypi" ]
        default: "none"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  smoke-test:
    # the wheel installed in a clean environment, away from the repository: the model must build from the installed
    # package alone
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Retrieve the distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Install the wheel and build the model
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/python -c "from capri_mod.model import CAPRIModel; CAPRIModel(verbose=False); print('the installed package builds the model')"

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    runs-on: ubuntu-latest
    needs: smoke-test
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/capri-mod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: smoke-test
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/capri-mod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

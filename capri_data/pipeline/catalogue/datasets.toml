# The download layer's dataset catalogue (configuration, not data): one [[dataset]] table per dataset the pipeline
# downloads. Read by capri_mod/pipeline/catalogue.py; `python -m capri_mod.pipeline fetch --all` downloads the entries
# with status "available" whose provider has an adapter. Keys:
#   provider      eurostat | faostat | oecd | dgagri
#   dataset       the provider's current code
#   filters       {dimension = code or [codes]} restricting the query (Eurostat: SDMX dimension ids; FAOSTAT: CSV columns)
#   start, end    first / last period
#   status        available | discontinued | replaced_partially | unknown
#   capri_items   the CAPRI items it feeds;  coco_source  CAPRI file and line of the mapping
#   old_code_in_capri, replacement, dimensions, regional_level, notes
# Mapped from CAPRI star 3.0's COCO code and checked against the providers on 23 October 2026 (COCO_INPUTS.md).

[[dataset]]
provider = "eurostat"
dataset = "apro_cpnh1"
status = "available"
capri_items = "crop LEVL (strucpro AR; MA for GRAS,FARA); GROF (PR); DRMA (HU = humidity of fodder crops, used to compute dry matter); Eurostat yields not mapped: COCO computes YILD = GROF/LEVL*1000 (coco/coco1_cropyields.gms:27-41)"
coco_source = "eurostat_raw/agriculture_mapping.gms:1377-1570; eurostat_raw.gms:241-274 -> dat/coco/agri_prod.gdx -> coco/coco1_eurostat.gms:82-85"
old_code_in_capri = "apro_cpnh1"
dimensions = "freq;crops;strucpro;geo;TIME_PERIOD"
regional_level = "national"
notes = "Current strucpro codes (codelist checked 23-10-2026): AR_THS_HA, HPRD_THS_T, MAR_THS_HA, HUMD_PC, YLD_T_HA. CAPRI item names use the old codes AR/PR/MA/HU (e.g. apro_cpnh1_C1000_AR). National humidity. CAPRI comment calls this table \"acs\" (coco/coco1_eurostat.gms:127,130)."


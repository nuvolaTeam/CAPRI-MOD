# CAPRI's emission tax at EUR 50 per t CO2-eq (pol_input/ecampa/carbtax50_endotech_set14td.gms l. 67-72, 223-238;
# the project lead, 27 November 2026: the set14td file, which builds on pol_input/cap_after_2014/ref.gms l. 58 as the
# Green Deal reference does, pol_input/greendeal/ref.gms l. 23; until then carbtax50_endotech_set12.gms, which builds on
# pol_input/mtr_rd.gms)
[scenario]
name = "CARBON_TAX_50"
short_name = "carbtax50"
kind = "scenario"
description = "CAPRI emission tax at EUR 50.0/t CO2-eq on EU agricultural emissions (ghgTax)."
capri_files = ["pol_input/ecampa/carbtax50_endotech_set14td.gms"]
reference = "ref_star3"
reference_note = "CAPRI's file builds on the CAP policy of the Green Deal reference (cap_after_2014/ref.gms); this scenario runs on the Green Deal reference with that reference's mitigation options (pol_input/greendeal/refpol_endotech_all_sup.gms l. 217-226), which differ from the file's own option list (l. 188): the file has the methane vaccine (VACCIN) and milk-yield breeding (GENET_yld, ghgTechMYld 0.3) and none of the ammonia options, 3NOP, WinterCov, ConsTill, NoTill and VRT_SRUC; and the low-N feed, breeding and linseed-nitrate options in all supply regions"

[scenario.shocks]
carbon_tax = 50.0

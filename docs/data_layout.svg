<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The capri_data directory: a base-year folder holding supply, market, policy, environment and feed inputs, plus shared data, raw sources, the input schema, the sourcing registry and validation artifacts.">
  <defs>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1c2b2d" flood-opacity="0.14"/>
    </filter>
    <symbol id="folder" viewBox="0 0 18 14">
      <path d="M1.5 3 a1.5 1.5 0 0 1 1.5-1.5 h4 l1.5 1.6 h7.5 a1.5 1.5 0 0 1 1.5 1.5 v6.4 a1.5 1.5 0 0 1 -1.5 1.5 h-13 a1.5 1.5 0 0 1 -1.5-1.5 z"/>
    </symbol>
    <symbol id="file" viewBox="0 0 14 16">
      <path d="M2.5 1 h6 l3.5 3.5 v10 a1 1 0 0 1 -1 1 h-8.5 a1 1 0 0 1 -1-1 v-12.5 a1 1 0 0 1 1-1 z"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="880" height="600" fill="#ffffff"/>

  <!-- title -->
  <text x="440" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#1c2b2d">CAPRI&#8209;mod &#8212; the data layer</text>
  <text x="440" y="70" text-anchor="middle" font-size="13.5" fill="#5c6b70">How <tspan font-family="Georgia, serif" font-style="italic">capri_data/</tspan> is organised on disk</text>

  <!-- connectors: main rail (children of capri_data) -->
  <g stroke="#c3cfd1" stroke-width="1.5" fill="none">
    <path d="M60 132 V512"/>
    <path d="M60 167 H80"/>
    <path d="M60 384 H80"/>
    <path d="M60 416 H80"/>
    <path d="M60 448 H80"/>
    <path d="M60 480 H80"/>
    <path d="M60 512 H80"/>
    <!-- secondary rail (children of base_year) -->
    <path d="M116 190 V344"/>
    <path d="M116 216 H132"/>
    <path d="M116 248 H132"/>
    <path d="M116 280 H132"/>
    <path d="M116 312 H132"/>
    <path d="M116 344 H132"/>
  </g>

  <!-- root -->
  <rect x="40" y="98" width="196" height="34" rx="9" fill="#33454e" filter="url(#soft2)"/>
  <use href="#folder" x="54" y="108" width="16" height="14" fill="#ffffff"/>
  <text x="78" y="120" font-size="14" font-weight="600" fill="#ffffff" font-family="Georgia, serif">capri_data/</text>

  <!-- base_year -->
  <rect x="80" y="150" width="176" height="34" rx="8" fill="#eef1f2" stroke="#d5dcde"/>
  <use href="#folder" x="94" y="160" width="16" height="14" fill="#64748b"/>
  <text x="118" y="172" font-size="13" font-weight="600" fill="#33454e" font-family="Georgia, serif">&lt;base_year&gt;/</text>
  <text x="272" y="171" font-size="11.5" fill="#5c6b70">year&#8209;specific inputs (e.g. <tspan font-family="Georgia, serif" font-style="italic">2017/</tspan>)</text>

  <!-- base_year group container -->
  <rect x="100" y="192" width="742" height="164" rx="11" fill="#fafbfb" stroke="#e5e9ea"/>

  <!-- category rows: each colour = the module the data feeds -->
  <!-- supply -->
  <use href="#folder" x="134" y="209" width="16" height="14" fill="#2e6f4e"/>
  <text x="158" y="221" font-size="12.5" font-weight="600" fill="#2e6f4e" font-family="Georgia, serif">supply/</text>
  <text x="280" y="221" font-size="11.5" fill="#5c6b70">20 files &#8212; yields, areas, costs, PMP terms, elasticities</text>
  <!-- market -->
  <use href="#folder" x="134" y="241" width="16" height="14" fill="#326b87"/>
  <text x="158" y="253" font-size="12.5" font-weight="600" fill="#326b87" font-family="Georgia, serif">market/</text>
  <text x="280" y="253" font-size="11.5" fill="#5c6b70">9 files &#8212; prices, Armington params, trade, FAO baseline</text>
  <!-- policy -->
  <use href="#folder" x="134" y="273" width="16" height="14" fill="#9c6b1f"/>
  <text x="158" y="285" font-size="12.5" font-weight="600" fill="#9c6b1f" font-family="Georgia, serif">policy/</text>
  <text x="280" y="285" font-size="11.5" fill="#5c6b70">2 files &#8212; CAP premiums &amp; instruments</text>
  <!-- environment -->
  <use href="#folder" x="134" y="305" width="16" height="14" fill="#2e6f4e"/>
  <text x="158" y="317" font-size="12.5" font-weight="600" fill="#2e6f4e" font-family="Georgia, serif">environment/</text>
  <text x="280" y="317" font-size="11.5" fill="#5c6b70">4 files &#8212; nutrient coefs, manure, climate zones, EFs</text>
  <!-- feed -->
  <use href="#folder" x="134" y="337" width="16" height="14" fill="#9c6b1f"/>
  <text x="158" y="349" font-size="12.5" font-weight="600" fill="#9c6b1f" font-family="Georgia, serif">feed/</text>
  <text x="280" y="349" font-size="11.5" fill="#5c6b70">2 files &#8212; requirements, availability</text>

  <!-- shared -->
  <use href="#folder" x="88" y="377" width="16" height="14" fill="#64748b"/>
  <text x="112" y="389" font-size="13" font-weight="600" fill="#33454e" font-family="Georgia, serif">shared/</text>
  <text x="272" y="389" font-size="11.5" fill="#5c6b70">base&#8209;year&#8209;independent (e.g. trade flows)</text>

  <!-- sources -->
  <use href="#folder" x="88" y="409" width="16" height="14" fill="#64748b"/>
  <text x="112" y="421" font-size="13" font-weight="600" fill="#33454e" font-family="Georgia, serif">sources/</text>
  <text x="272" y="421" font-size="11.5" fill="#5c6b70">raw extracted CAPRI tables (capreg, arm, estnlp &#8230;)</text>

  <!-- INPUT_SCHEMA.json -->
  <use href="#file" x="90" y="440" width="12" height="14" fill="#326b87"/>
  <text x="112" y="453" font-size="13" font-weight="600" fill="#33454e" font-family="Georgia, serif">INPUT_SCHEMA.json</text>
  <text x="330" y="453" font-size="11.5" fill="#5c6b70">declarative source of truth for every input</text>

  <!-- DATA_SOURCING_REGISTRY.json -->
  <use href="#file" x="90" y="472" width="12" height="14" fill="#326b87"/>
  <text x="112" y="485" font-size="13" font-weight="600" fill="#33454e" font-family="Georgia, serif">DATA_SOURCING_REGISTRY.json</text>
  <text x="392" y="485" font-size="11.5" fill="#5c6b70">per&#8209;dataset provenance + every bug fixed</text>

  <!-- validation -->
  <use href="#folder" x="88" y="505" width="16" height="14" fill="#64748b"/>
  <text x="112" y="517" font-size="13" font-weight="600" fill="#33454e" font-family="Georgia, serif">validation/</text>
  <text x="272" y="517" font-size="11.5" fill="#5c6b70">validation artifacts (Green Deal, PMRK checks)</text>

  <!-- caption -->
  <text x="440" y="562" text-anchor="middle" font-size="11.5" fill="#8a9aa0">Folder colours match the modules the data feeds &#8212; <tspan fill="#2e6f4e">supply</tspan>, <tspan fill="#326b87">market</tspan>, <tspan fill="#9c6b1f">policy</tspan>, and so on.</text>
</svg>
